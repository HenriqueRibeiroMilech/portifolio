services:
  - type: web
    name: henrique-milech-portfolio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && npm ci --include=dev && npm run build
    startCommand: python -m server
    healthCheckPath: /
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6.1-terra
